syntax = "proto3";

package marketgateway.v1;

// This tells the Go compiler where to put the generated code
option go_package = "ingestor/gen/marketgateway/v1";

// The core gRPC service our Go app will serve
service MarketDataService {
  // Unary: Gets a single snapshot instantly from the Go RWMutex Cache
  rpc GetMarketSnapshot(SnapshotRequest) returns (MarketSnapshot);

  // Server-streaming: Maintains a persistent open connection (faster than RabbitMQ!)
  rpc StreamMarketData(StreamRequest) returns (stream MarketSnapshot);

  // Unary: AI/Matching engine checks this before allowing a trade
  rpc GetVolatilityScore(VolatilityRequest) returns (VolatilityResponse);

  // Unary: Fetch historical OHLCV data for Candlestick charting
  rpc GetHistoricalKlines(KlinesRequest) returns (KlinesResponse);

  // Unary: Fetch the current order book depth (bids and asks) for visual mapping
  rpc GetOrderBookDepth(OrderBookRequest) returns (OrderBookResponse);
}

// --- Requests ---
message SnapshotRequest {
  string symbol = 1;
}

message StreamRequest {
  repeated string symbols = 1; // Allows subscribing to multiple coins
}

message VolatilityRequest {
  string symbol = 1;
}

message KlinesRequest {
  string symbol = 1;
  string interval = 2; // e.g., "1m", "5m", "1h", "1d"
  int32 limit = 3;     // Number of data points to return (e.g., 50)
}

message OrderBookRequest {
  string symbol = 1;
  int32 limit = 2; // e.g., 10 levels deep
}

// --- Responses ---
message MarketSnapshot {
  string symbol        = 1;
  double price         = 2;
  double volatility    = 3;
  int64  timestamp_utc = 4;
}

message VolatilityResponse {
  string symbol     = 1;
  double volatility = 2;
  string regime     = 3; // "LOW", "NORMAL", "HIGH"
}

// --- Data Structures ---
message Kline {
  int64 start_time_utc = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double volume = 6;
}

message KlinesResponse {
  string symbol = 1;
  repeated Kline klines = 2;
}

message OrderBookEntry {
  double price = 1;
  double size = 2;
}

message OrderBookResponse {
  string symbol = 1;
  repeated OrderBookEntry bids = 2;
  repeated OrderBookEntry asks = 3;
  int64 last_update_id = 4; // To keep sync with streams if needed
}