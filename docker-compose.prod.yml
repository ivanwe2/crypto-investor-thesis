# Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Required .env.prod variables:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   RABBITMQ_USER, RABBITMQ_PASS
#   GRAFANA_ADMIN_USER, GRAFANA_ADMIN_PASSWORD
#   CLOUDFLARE_TUNNEL_TOKEN
#
# The Cloudflare Tunnel should point a single public hostname (app.yourdomain.com)
# to http://web-client:80. Nginx inside web-client proxies /api and /hub internally
# to trade-engine:8080, so no second tunnel route is needed.

services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmqdata_prod:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - backend

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  # ============================================================
  # MICROSERVICES
  # ============================================================

  trade-engine:
    build:
      context: ./trade-engine/TradeEngine
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host:          rabbitmq
      RabbitMq__Port:          5672
      RabbitMq__Username:      ${RABBITMQ_USER}
      RabbitMq__Password:      ${RABBITMQ_PASS}
      RabbitMq__ManagementUrl: >-
        http://rabbitmq:15672/api/queues/%2f/trade_engine_queue
      Otlp__Endpoint:          http://otel-collector:4317
      Otlp__ServiceName:       trade-engine
      Otlp__ServiceVersion:    v1.0.0
      MarketGateway__Url:      http://ingestor:50051
      MarketGateway__HealthUrl: http://ingestor:8081/healthz
      AiAnalyst__HealthUrl:    http://ai-analyst:8000/healthz
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - backend
      - frontend

  ingestor:
    build:
      context: ./ingestor
      dockerfile: Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      trade-engine:
        condition: service_healthy
    environment:
      ENVIRONMENT:              production
      MARKET_CACHE_ADDRESS:     redis:6379
      TRADE_ENGINE_GRPC_ADDRESS: trade-engine:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    networks:
      - backend

  ai-analyst:
    build:
      context: ./ai-analyst
      dockerfile: Dockerfile
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    networks:
      - backend

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
      args:
        # Relative paths work because nginx.prod.conf proxies /api and /hub
        # to trade-engine:8080 within the Docker network.
        VITE_API_URL: /api
        VITE_WS_URL:  /hub
    restart: always
    # Override the default nginx.conf with the prod version that includes proxy_pass rules
    volumes:
      - ./web-client/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      trade-engine:
        condition: service_healthy
    networks:
      - frontend

  # ============================================================
  # OBSERVABILITY STACK
  # Secured: Grafana requires login (no anonymous access in prod).
  # Grafana is NOT exposed on a public port — access it via the
  # Cloudflare Zero Trust tunnel with email/SSO policy enforced.
  # ============================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata_prod:/prometheus
    networks:
      - backend

  loki:
    image: grafana/loki:2.9.0
    restart: always
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata_prod:/loki
    networks:
      - backend

  tempo:
    image: grafana/tempo:2.4.1
    restart: always
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempordata_prod:/var/tempo
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      # Disable anonymous access — require login in production
      GF_AUTH_ANONYMOUS_ENABLED:    "false"
      GF_AUTH_DISABLE_LOGIN_FORM:   "false"
      GF_SECURITY_ADMIN_USER:       ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD:   ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL:           https://grafana.${DOMAIN:-yourdomain.com}
    volumes:
      - ./infra/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infra/observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata_prod:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - backend
      - frontend  # Needs to be on frontend so cloudflared can reach it

  # ============================================================
  # CLOUDFLARE TUNNEL (Zero Trust)
  # Maps public hostnames to internal services:
  #   app.yourdomain.com     → http://web-client:80   (React SPA + proxied API/WS)
  #   grafana.yourdomain.com → http://grafana:3000    (protect with ZT Access policy)
  # ============================================================

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web-client
      - grafana
    networks:
      - frontend
      - backend

volumes:
  pgdata_prod:
  redisdata_prod:
  rabbitmqdata_prod:
  prometheusdata_prod:
  lokidata_prod:
  tempordata_prod:
  grafanadata_prod:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
