services:
  # ==============================================
  # INFRASTRUCTURE
  # ==============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: thesis-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thesis-network

  postgres:
    image: postgres:17-alpine
    container_name: thesis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trading_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - thesis-network

  redis:
    image: redis:alpine
    container_name: thesis-redis
    ports:
      - "6379:6379"
    networks:
      - thesis-network

  # ==============================================
  # MICROSERVICES
  # ==============================================
  
  ingestor:
    build: 
      context: ./ingestor
      dockerfile: Dockerfile
    container_name: thesis-ingestor
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    networks:
      - thesis-network

  trade-engine:
    build:
      context: ./trade-engine/TradeEngine
      dockerfile: Dockerfile
    container_name: thesis-trade-engine
    restart: on-failure
    ports:
      - "5000:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development 
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=trading_db;Username=admin;Password=password
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=user
      - RabbitMq__Password=password
    networks:
      - thesis-network

  ai-analyst:
    build:
      context: ./ai-analyst
      dockerfile: Dockerfile
    container_name: thesis-ai-analyst
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - thesis-network

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: thesis-web-client
    ports:
      - "3000:80" 
    depends_on:
      - trade-engine
    networks:
      - thesis-network

  # ==========================================
  # Observability Stack (v0.4)
  # ==========================================
  
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - thesis-network

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - thesis-network

  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4317"
    networks:
      - thesis-network

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - thesis-network

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3001:3000" # Changed from 3000 to 3001 to avoid React conflict
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - thesis-network

networks:
  thesis-network:
    driver: bridge

volumes:
  postgres_data: