services:
  # ==============================================
  # INFRASTRUCTURE
  # ==============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: thesis-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: thesis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trading_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: thesis-redis
    ports:
      - "6379:6379"

  # ==============================================
  # MICROSERVICES
  # ==============================================
  
  # 1. GO INGESTOR
  ingestor:
    build: 
      context: ./ingestor
      dockerfile: Dockerfile
    container_name: thesis-ingestor
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/

  # 2. .NET TRADE ENGINE
  trade-engine:
    build:
      context: ./trade-engine/TradeEngine
      dockerfile: Dockerfile
    container_name: thesis-trade-engine
    restart: on-failure
    ports:
      - "5000:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      # Enable 'Information' logs so we can see "Connected"
      - ASPNETCORE_ENVIRONMENT=Development 
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=trading_db;Username=admin;Password=password
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      # Pass the credentials so we don't get rejected as 'guest'
      - RabbitMq__Username=user
      - RabbitMq__Password=password

  # 3. PYTHON AI ANALYST
  ai-analyst:
    build:
      context: ./ai-analyst
      dockerfile: Dockerfile
    container_name: thesis-ai-analyst
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  # 4. REACT WEB CLIENT (NEW)
  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: thesis-web-client
    ports:
      - "3000:80" # Maps localhost:3000 -> Container Nginx Port 80
    depends_on:
      - trade-engine

volumes:
  postgres_data: